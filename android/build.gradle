allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// media_kit_video and media_kit_libs_android_video still declare Java 1.8
// compatibility, which javac reports as an obsolete source/target on JDK 21.
// Both are already at their latest published versions, so the level cannot be
// raised from here; javac's own suggested flag silences the notice instead.
// ':app' is deliberately excluded — diagnostics about our own sources must stay
// visible, and it already compiles at 17.
subprojects { subproject ->
    if (subproject.path != ':app') {
        subproject.tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << '-Xlint:-options'
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
