pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Stay on AGP 8.x until every Flutter plugin this app uses has migrated off
    // applying kotlin-android. AGP 9 + android.builtInKotlin=false currently
    // leaves plugin Kotlin sources uncompiled (empty classes.jar), so a full
    // AGP 9 bump is blocked by the plugin ecosystem, not the app module.
    // Flutter 3.44 template default is AGP 9.0.1 — revisit when plugins migrate.
    // See: https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
