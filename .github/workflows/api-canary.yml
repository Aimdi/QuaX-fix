name: api-canary

# X can rotate a GraphQL query id at any time, and the app only finds out when
# a feature starts returning 404. This probes every endpoint daily so breakage
# is discovered here rather than in a bug report.
on:
  workflow_dispatch:
  schedule:
    # 05:20 UTC — off the hour, where scheduled-run contention is lowest.
    - cron: '20 5 * * *'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate sources
        run: |
          dart run dart_pubspec_licenses:generate
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material

      - name: Probe live endpoints
        id: probe
        run: |
          set -o pipefail
          flutter test test/live --dart-define=RUN_LIVE=true --reporter expanded 2>&1 | tee canary.log

      - name: Summarise
        if: always()
        run: |
          {
            echo '### Endpoint canary'
            echo '```'
            grep -E 'ROTATED|alive|ok|rate limited' canary.log || echo 'no endpoint table in output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One open issue per breakage, not one per day: an existing report gets a
      # comment instead so the thread stays the single record of the outage.
      - name: Report breakage
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf 'The daily endpoint canary failed.\n\n%s\n\n```\n%s\n```\n' \
            "$RUN_URL" "$(grep -E 'ROTATED|alive|ok|rate limited' canary.log | head -40)")

          existing=$(gh issue list --label api-breakage --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create api-breakage --color B60205 --description "X changed its API" 2>/dev/null || true
            gh issue create --title "X API canary failed" --label api-breakage --body "$body"
          fi
